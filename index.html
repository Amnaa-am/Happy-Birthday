<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#29213f">
<title>Happyy Birthdayyyy BBG 💜</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --night: #211a35;
  --deep: #29213f;
  --purple: #65527f;
  --lavender: #aa96d0;
  --silver: #ded9eb;
  --white: #fbf9ff;
  --glass: rgba(235,228,255,.065);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--white);
  background:
    radial-gradient(ellipse at 15% 15%, #594576 0, transparent 38%),
    radial-gradient(ellipse at 90% 80%, #403353 0, transparent 42%),
    linear-gradient(140deg, #171322, #29213f 55%, #211a35);
  font-family: "Cormorant Garamond", serif;
  overflow-x: hidden;
}

button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}

button:focus-visible, a:focus-visible {
  outline: 2px solid var(--silver);
  outline-offset: 4px;
}

#sky, #effects {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px 2px #d8caff;
  animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
}

.glitter {
  position: absolute;
  color: #e7dfff;
  text-shadow: 0 0 10px #d8c7ff, 0 0 22px #a88be4;
  animation: drift var(--duration, 8s) linear infinite;
}

@keyframes twinkle {
  from { opacity: .18; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.3); }
}

@keyframes drift {
  from { transform: translateY(110vh) rotate(0); opacity: 0; }
  10%, 85% { opacity: .75; }
  to { transform: translateY(-15vh) rotate(220deg); opacity: 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes glow {
  0%, 100% { filter: drop-shadow(0 0 4px #b7a3e9); }
  50% { filter: drop-shadow(0 0 15px #e1d5ff); }
}

@keyframes bloom {
  0% { transform: scale(.3) rotate(-35deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

@keyframes rise {
  from { transform: translateY(25px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

header {
  position: relative;
  z-index: 5;
  padding: 20px 18px 8px;
  text-align: center;
}

.brand {
  font-family: "Cormorant Garamond", serif;
  font-size: 1.45rem;
  color: var(--silver);
  letter-spacing: .5px;
}

main {
  position: relative;
  z-index: 2;
  width: min(900px, 100%);
  margin: auto;
  padding: 8px 16px 110px;
}

.slide {
  display: none;
  min-height: 72vh;
  padding: 24px 0 35px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  animation: rise .65s ease both;
}

.slide.active { display: flex; }

.eyebrow {
  color: #cbbce9;
  font-size: .75rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

h1, h2, h3 {
  font-family: "Playfair Display", serif;
  font-weight: 600;
}

h1 {
  font-size: clamp(2.6rem, 9vw, 5rem);
  line-height: 1.12;
  margin: 8px 0 16px;
  color: #eee8ff;
  text-shadow: 0 0 22px #a18ad0;
}

h2 {
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  line-height: 1.12;
  margin: 5px 0 16px;
  color: #e6dcff;
}

h3 { color: #e6dcff; }

p {
  line-height: 1.9;
  color: #e3ddec;
}

.subtitle {
  max-width: 620px;
  margin: 0 auto 24px;
  font-size: .96rem;
}

.card {
  width: min(650px, 100%);
  padding: clamp(20px, 5vw, 36px);
  border: 1px solid rgba(222,217,235,.25);
  border-radius: 26px;
  background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(183,158,222,.045));
  box-shadow: 0 15px 55px rgba(0,0,0,.16), inset 0 0 30px rgba(208,188,255,.025);
  backdrop-filter: blur(8px);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 21px;
  margin: 7px 4px;
  border: 1px solid rgba(222,217,235,.75);
  border-radius: 30px;
  color: #f6f0ff;
  background: rgba(153,128,196,.09);
  box-shadow: 0 0 12px rgba(177,151,230,.08);
  transition: .25s ease;
}

.btn:hover {
  background: rgba(180,157,222,.2);
  box-shadow: 0 0 20px rgba(196,177,255,.35);
  transform: translateY(-2px);
}

.btn:disabled { opacity: .4; cursor: not-allowed; }
.small { font-size: .8rem; color: #bdb2d0; }

.nav {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, rgba(24,19,37,.96) 25%);
}

.nav .btn { padding: 9px 16px; font-size: .85rem; }

.dots {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 0 12px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #766987;
  border: 0;
  padding: 0;
}

.dot.active {
  background: #e0d3ff;
  box-shadow: 0 0 10px #d5c4ff;
  transform: scale(1.35);
}

.map-art {
  width: 100%;
  max-width: 520px;
  height: auto;
  margin: 10px auto 20px;
}

.heart {
  display: inline-block;
  color: #d7c2ff;
  font-size: 2.6rem;
  filter: drop-shadow(0 0 10px #b69de9);
  animation: float 2.4s ease-in-out infinite;
}

.heart-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 12px 0;
}

.heart-buttons .btn { font-size: 1.05rem; }

.unlock-message {
  min-height: 30px;
  color: #e9dfff;
}

.gift {
  font-size: clamp(5rem, 20vw, 8rem);
  border: 1px solid rgba(222,217,235,.35);
  border-radius: 30px;
  background: rgba(177,151,225,.08);
  padding: 12px 32px;
  margin: 10px auto 18px;
  filter: drop-shadow(0 0 14px rgba(193,173,246,.22));
  animation: float 3s ease-in-out infinite;
  transition: .5s;
}

.gift.open {
  transform: rotate(-6deg) scale(1.08);
  filter: drop-shadow(0 0 25px #cbb8ff);
}

.hidden-message { display: none; }
.hidden-message.show { display: block; animation: bloom .8s ease both; }

.cake {
  position: relative;
  width: 220px;
  height: 190px;
  margin: 28px auto 10px;
}

.cake-layer {
  position: absolute;
  left: 10px;
  width: 200px;
  border: 1px solid #d7c7f3;
  background: linear-gradient(100deg, #766092, #a38bc3, #59446f);
  box-shadow: inset 0 -8px 0 rgba(34,24,49,.25), 0 5px 15px #151020;
  border-radius: 12px 12px 18px 18px;
}

.cake-layer.top { top: 74px; height: 65px; }

.cake-layer.bottom {
  top: 125px;
  height: 58px;
  background: linear-gradient(100deg, #564269, #8771a6, #49365f);
}

.frosting {
  position: absolute;
  z-index: 2;
  top: 69px;
  left: 8px;
  width: 204px;
  height: 20px;
  border-radius: 50%;
  background: #e5d9f3;
  box-shadow: 0 4px 0 #c4b0e2;
}

.candles {
  position: absolute;
  z-index: 4;
  top: 25px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 20px;
}

.candle {
  position: relative;
  width: 8px;
  height: 46px;
  border-radius: 3px;
  background: repeating-linear-gradient(45deg, #f6edf8 0 5px, #b8a1db 5px 9px);
}

.flame {
  position: absolute;
  width: 13px;
  height: 19px;
  top: -20px;
  left: -3px;
  background: radial-gradient(ellipse at 50% 75%, #fff5c5, #f3b75c 55%, transparent 70%);
  border-radius: 50% 50% 45% 45%;
  animation: glow .7s infinite alternate;
}

.flame.out { display: none; }

.cake-label {
  position: absolute;
  z-index: 5;
  top: 95px;
  left: 0;
  right: 0;
  font-family: "Cormorant Garamond", serif;
  font-size: 1.45rem;
  color: #fff5ff;
  text-shadow: 0 0 6px #ddc8ff;
}

.birthday-photo {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid rgba(222,217,235,.35);
  background: #342849;
  color: #e7dfff;
  text-align: center;
}

.letter {
  text-align: left;
  font-family: "Cormorant Garamond", serif;
  font-size: 1.24rem;
  line-height: 1.85;
  color: #f1eafa;
  white-space: pre-wrap;
  min-height: 220px;
}

.gallery {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(155px, 100%), 1fr));
  gap: 15px;
  margin: 18px 0;
}

.polaroid {
  padding: 9px 9px 15px;
  background: #f2edf6;
  color: #3d304c;
  border-radius: 3px;
  box-shadow: 0 9px 20px rgba(0,0,0,.22);
  transform: rotate(var(--rotate, -2deg));
  transition: .3s;
}

.polaroid:hover { transform: rotate(0) translateY(-5px); }

.polaroid img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: #c6b7d7;
  color: #3d304c;
}

.polaroid span {
  display: block;
  padding-top: 9px;
  font-family: "Cormorant Garamond", serif;
  font-size: 1.15rem;
}

.slideshow {
  width: 100%;
  max-width: 440px;
  margin: 10px auto;
}

.slideshow img {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border: 7px solid rgba(239,231,247,.9);
  border-bottom-width: 24px;
  border-radius: 3px;
  box-shadow: 0 0 25px #a68ac9;
  background: #342849;
}

.video-box video {
  width: 100%;
  border-radius: 14px;
  background: #171322;
  border: 1px solid #79678f;
}

.secret-heart {
  font-size: 5rem;
  border: 0;
  background: none;
  animation: glow 1.8s infinite alternate, float 3s infinite;
}

.bouquet {
  font-size: 3.5rem;
  margin: 10px 0;
  animation: bloom .8s ease both;
}

#musicPanel {
  position: fixed;
  right: 12px;
  top: 12px;
  z-index: 20;
  width: min(320px, calc(100% - 24px));
  display: none;
  padding: 12px;
  background: #28203c;
  border: 1px solid #a99ac4;
  border-radius: 16px;
  box-shadow: 0 0 22px rgba(190,168,235,.25);
}

#musicPanel.show { display: block; }
#musicPanel iframe { width: 100%; height: 180px; border: 0; border-radius: 10px; }

.music-toggle {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 19;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid #c6b8e2;
  color: #f1eaff;
  background: rgba(80,63,111,.7);
  box-shadow: 0 0 12px rgba(189,168,235,.25);
}

#toast {
  min-height: 25px;
  font-size: .88rem;
  color: #e8dcff;
  margin: 8px 0;
}

.petal {
  position: fixed;
  top: -30px;
  z-index: 8;
  pointer-events: none;
  animation: petalFall 5s linear forwards;
}

@keyframes petalFall {
  to { transform: translateY(110vh) rotate(650deg); opacity: .1; }
}

@media (max-width: 500px) {
  main { padding-left: 12px; padding-right: 12px; }
  .slide { min-height: 70vh; }
  .card { border-radius: 20px; }
  .nav .btn { padding: 8px 12px; margin: 4px 2px; }
  .dots { gap: 6px; margin: 0 6px; }
  .cake { transform: scale(.9); margin-top: 10px; margin-bottom: 0; }
}
</style>
</head>
